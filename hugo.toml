baseURL = "https://playdelaybluelay-stack.github.io/"
title = "한예빈"
languageCode = "ko"
defaultContentLanguage = "ko"
hasCJKLanguage = true
enableRobotsTXT = true

[languages]
  [languages.ko]
    languageName = "한국어"
    weight = 1
  [languages.en]
    languageName = "English"
    weight = 2
    disabled = true # 영문 글이 생기면 false로

[taxonomies]
  tag = "tags"

[params]
  author = "한예빈"
  bio = "클라우드 인프라를 직접 설계하고 운영하며 기록합니다."
  email = "yebinhaan@gmail.com"
  github = "https://github.com/playdelaybluelay-stack"

[markup.highlight]
  noClasses = false
  codeFences = true

[markup.goldmark.parser.attribute]
  title = true

[outputs]
  home = ["HTML", "RSS"]
