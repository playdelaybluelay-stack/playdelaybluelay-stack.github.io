{{ define "main" }}
<div class="wrap">
  <section class="hero">
    <h1>{{ site.Params.author }}</h1>
    <p>{{ site.Params.bio }}</p>
  </section>
  <ul class="post-list">
    {{ range where site.RegularPages "Section" "posts" }}
    <li class="post-item">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p class="desc">{{ . }}</p>{{ end }}
      <p class="when">{{ .Date | time.Format "2006년 1월 2일" }}, {{ .ReadingTime }}분</p>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
