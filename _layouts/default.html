<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>
        {% if page.title %}{{ page.title }} — {{ site.name }}
        {% else %}{{ site.name }} — {{ site.description }}{% endif %}
    </title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta name="author" content="한예빈">

    <!-- Open Graph -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ site.url }}/assets/favicon.svg">

    <!-- Stylesheets -->
    {% if site.highlighter %}
        <link rel='stylesheet' href='{{ site.url }}/assets/css/syntax.css' type='text/css'>
    {% endif %}
    <link rel='stylesheet' href='{{ site.url }}/assets/css/main.css' type='text/css'>
</head>

<body>
    {% include header.html %}

    <div class="container">
        {{ content }}
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>© {{ 'now' | date: "%Y" }} {{ site.name }}</span>
            <div class="footer-links">
                <a href="https://github.com/playdelaybluelay-stack" target="_blank">GitHub</a>
                <a href="{{ site.url }}/about/">About</a>
            </div>
        </div>
    </footer>
</body>
</html>
